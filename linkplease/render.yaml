services:
  - type: web
    name: linkplease
    runtime: docker
    plan: free
    rootDir: linkplease
    healthCheckPath: /health

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: linkplease-db
          property: connectionString

      - key: PSEUDOGRAM_BASE_URL
        value: https://pseudogram-api.onrender.com

      - key: PSEUDOGRAM_API_KEY
        sync: false

databases:
  - name: linkplease-db
    plan: free